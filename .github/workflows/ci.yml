name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_oxe_jax:
        description: "Also run the OXEJAXDataset suite (experimental JAX backend, needs jax/jaxlib)"
        type: boolean
        default: false

jobs:
  # All four suites below are fully offline (HF/GCS/TAR/video calls are
  # monkeypatched or run against a synthetic fixture tree) and run on every
  # push and pull request. Each installs CPU-only torch first so setup.py's
  # own torch dependency resolves to an already-satisfied, CPU-only wheel
  # instead of pulling a CUDA build from PyPI.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        suite:
          - name: oxe
            extras: oxe
            test-path: test/test_oxe_dataset.py
          - name: hf-table30v2
            extras: hf
            test-path: test/test_table30v2_dataset.py
          - name: agibot
            extras: hf
            test-path: test/test_agibot_dataset.py
          - name: lerobot-video
            extras: hf
            test-path: test/test_lerobot_video_dataset.py

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install robotdataset[${{ matrix.suite.extras }},dev]
        run: pip install -e ".[${{ matrix.suite.extras }},dev]"

      - name: Run ${{ matrix.suite.name }} tests
        run: pytest ${{ matrix.suite.test-path }} -v

  # OXEJAXDataset is an optional, still-experimental backend (OXEJAXDataset
  # is None when jax isn't installed) -- kept opt-in via manual dispatch
  # rather than on every push/PR.
  test-oxe-jax:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_oxe_jax }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install robotdataset[oxe,dev] + jax
        run: |
          pip install jax jaxlib
          pip install -e ".[oxe,dev]"

      - name: Run OXEJAXDataset tests
        run: pytest test/test_oxe_jax_dataset.py -v

